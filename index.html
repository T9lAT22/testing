<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USJ Student Hub</title>
    <h1 class="title">USJ Students Hub</h1>

</head>
<body>
    <style>
        .title{
          background-color: #b20a0a;
      color: white;
      padding: 15px 30px;
      font-size: 2rem;
      font-weight: bold;
      border-radius: 12px;
      margin-bottom: 50px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        body{
            background-color: #ffffff;
              margin: 0;
      padding: 0;
      background-color: #f9f9f9;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
        }
        .image {
      width: 115px;
      height: 100px;
      padding: 10px 10px;
      background-color: #b41b1b;
      transition: 0.3s ease;
      border-radius: 0px;
      gap:20px;
    }

    .image:hover {
      border-radius: 15px;
      cursor: url('https://t9lat9.netfy.blog/hover22.png'), auto;
    }

 .container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh; /* Adjust this value to fit your needs */
    }
     .icon {
      width: 60px;
      height: 60px;
      cursor: pointer;
      transition: transform 0.2s ease;
      background-color: #b20a0a;
      padding:10px 20px;
      
    }

    .icon:hover {
      transform: scale(1.1);
    }


@keyframes shake-animation {
  /* Define the shaking animation */
  0% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  50% { transform: translateX(5px); }
  75% { transform: translateX(-5px); }

    }
    </style>
      <div class="container">
      <a onclick="calander()">
    <img src="calander.png" alt="Calendar" class="icon">
    </a>
       <a onclick="news()">
    <img src="news.png" alt="News" class="icon">
    </a>
  
  </div>


  <div id="CalanderDiv">
  <button class="close-btn" onclick="document.getElementById('CalanderDiv').style.display = 'none';">×</button>


 
    <iframe class="frame" src="https://calendar.google.com/calendar/u/0/embed?height=600&wkst=1&bgcolor=%23ffffff&ctz=America/Chicago&title=USJ+Full+Calendar+of+Events&src=MWQyOW1iMmRqdWM1cHJubHRkb2cxMjc4ZmMzYjRmdnNAaW1wb3J0LmNhbGVuZGFyLmdvb2dsZS5jb20&color=%234285F4&pli=1"></iframe>
  <style>
    .frame{
      width:100%;
      height:95%;
      bottom:0;
      position: absolute;
      border:none;
      border-radius:0px 0px 20px 20px;
      left:0;
    }
  </style>
           
</div>
<script>
  function calander(){
    const div = document.getElementById('CalanderDiv');
    div.style.display = div.style.display === 'block' ? 'none' : 'block';
  }
</script>
<script>
  function news(){
    const div = document.getElementById('newsDiv');
    div.style.display = div.style.display === 'block' ? 'none' : 'block';
  }
</script>
<style>
     #CalanderDiv {
    display: none;
    margin-top: 20px;
    padding: 10px;
    background-color: #141414;
    color: white;
    inset: 0;
    margin:auto;
    position: fixed;
    z-index: 1000;
    border-radius:20px; 
    opacity:85%; 
    width:85%;
    height: 73%; 
    overflow-x: hidden;
    overflow-y: auto;
      animation: popIn 0.5s ease-out forwards;

  }
   .close-btn {
    background: none;
    border: none;
    color: rgb(255, 0, 0);
    font-size: 24px;
    cursor: pointer;
    padding: 0;
    font-size:20px;
}

 @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(0.8);
      }
      100% {
        opacity: 80%;
        transform: scale(1);
      }
    }

      #newsDiv {
    display: none;
    margin-top: 20px;
    padding: 10px;
    background-color: #2e2e2e;
    color: white;
    inset: 0;
    margin:auto;
    position: fixed;
    z-index: 1000;
    border-radius:20px; 
    opacity:85%; 
    width:600px;
    height: 500px; 
    overflow-x: hidden;
    overflow-y: auto;
      animation: popIn 0.5s ease-out forwards;

  }
</style>

<div id="newsDiv">
  <button class="close-btn" onclick="document.getElementById('newsDiv').style.display = 'none';">×</button>


 
    <section>
    <h2>USJ News & Events Hub</h2>
    <p>Stay updated with all the latest happenings at USJ.</p>
    <p class="post">Posted by: developer</p>
  </section>

     <section>
    <h2>School is starting...</h2>
    <p>School is going to start at Augest 6th. And also parents orientation is in Augest 12th.</p>
    <p class="post">Posted by: developer</p>
  </section>


<style>
  section {
  background-color:black;
  padding: 20px;
  margin-bottom: 20px;
  border-radius:20px;
    color:white;
}

</style>

<style>
   .post {
    color:#adacac;
    font-size:14px;
   }
    
</style>

</div>

    
</body>
</html>
