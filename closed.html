<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>USJ Chat Guidelines</title>
  <style>
    body {
      background-color: #d61616;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 30px;
      max-width: 600px;
    }

    .btn {
      padding: 12px 24px;
      border-radius: 8px;
      background-color: #0687dd;
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 1rem;
      transition: background-color 0.3s;
    }

    .btn:hover {
      background-color: #0687dd;
    }
  </style>
</head>
<body>

  <h1>
Chat is closed temporarily
  </h1>


</body>
</html>
